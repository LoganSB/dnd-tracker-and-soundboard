<!doctype html>
<!--
  party.html - the Characters tab: one character's sheet (five sub-menu pages) with a picker to switch character.

  SERVED AT: /party (the "Characters" tab) and /party/<id>. Home lists, uploads and exports characters.

  An empty toolbar (div#partyBar) and an empty content area (div#view): party.js builds both at runtime. Its only Jinja2 substitution is
  role ("dm" or "player") on the body tag.

  SCRIPTS (in order):
    1. /static/ui.js, finder.js, vitals.js - shared: the tables (search, filters, pages), sub-menu tabs and the
       HP / hit dice / conditions controls.
    2. /static/nodes.js, loottable.js, spells.js - the pop-up and form dialogs, and the magic item and spell searches the
       Add loot / Add spell buttons open.
    3. /static/tracker.js - the live tracker. party.js reuses it.
    4. /static/sheet.js   - the panels of a character's sheet (Tracker extras, Skills and Stats, Inventory, Spells, Feats...).
    5. /static/party.js   - builds this page's UI into #partyBar and #view.

  The body class "partypage" lets style.css apply rules only to this page.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/jpeg" href="/static/icon.jpeg">
</head>
<body class="partypage" data-role="{{ role }}">
<header>
  <!-- Breadcrumb: links back to the soundboard ("/") and to this page. class "plain" = links styled like normal text. -->
  <!-- partyBar: toolbar area, filled by party.js -->
  <div class="bar" id="partyBar"></div>
</header>
<!-- view: main content area, filled by party.js -->
<div id="view"></div>
<script src="/static/errors.js"></script>
<script src="/static/ui.js"></script>
<script src="/static/finder.js"></script>
<script src="/static/conditions.js"></script>
<script src="/static/vitals.js"></script>
<script src="/static/nodes.js"></script>
<script src="/static/loottable.js"></script>
<script src="/static/spells.js"></script>
<script src="/static/monsters.js"></script>
<script src="/static/tracker.js"></script>
<script src="/static/sheet.js"></script>
<script src="/static/party.js"></script>
</body>
</html>
